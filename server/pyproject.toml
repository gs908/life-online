[project]
name = "life-online-server"
version = "0.0.0"
description = "Life Online backend server (FastAPI + MySQL + MinIO)"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncmy>=0.2.10",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "alembic>=1.14.0",
    "pyjwt>=2.10.0",
    "httpx>=0.27.2",
    "openai>=1.54.0",
    "minio>=7.2.8",
    "apscheduler>=3.10.4",
    "python-multipart>=0.0.17",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
