# server/config.yaml
# 配置文件:结构化默认值在这里,所有敏感/环境相关值通过 ${env:VAR_NAME} 从 .env 注入。
# 占位符格式:${env:VAR}      (必填,缺失报错)
# 带默认值的占位符格式:${env:VAR:default}  (缺失时使用 default)

app:
  name: life-online
  host: ${env:APP_HOST:0.0.0.0}
  port: ${env:APP_PORT:8000}
  workers: 1
  debug: ${env:APP_DEBUG:true}
  log_level: ${env:APP_LOG_LEVEL:INFO}
  cors_origins:
    - http://localhost:3000
    - http://localhost:5173

database:
  dialect: ${env:DATABASE_DIALECT:postgresql}
  async_driver: ${env:DATABASE_ASYNC_DRIVER:asyncpg}
  sync_driver: ${env:DATABASE_SYNC_DRIVER:psycopg}
  host: ${env:DATABASE_HOST:127.0.0.1}
  port: ${env:DATABASE_PORT:5432}
  user: ${env:DATABASE_USER:postgres}
  password: ${env:DATABASE_PASSWORD:}
  database: ${env:DATABASE_NAME:postgres}
  sslmode: ${env:DATABASE_SSLMODE:require}
  query:
    application_name: ${env:DATABASE_APPLICATION_NAME:life-online}
  pool:
    pool_pre_ping: true
    pool_recycle: 3600

storage:
  provider: ${env:STORAGE_PROVIDER:minio}
  minio:
    endpoint: ${env:MINIO_ENDPOINT:}
    access_key: ${env:MINIO_ACCESS_KEY:}
    secret_key: ${env:MINIO_SECRET_KEY:}
    secure: ${env:MINIO_SECURE:false}
    bucket: ${env:MINIO_BUCKET:life-online}
  local:
    root_path: ${env:LOCAL_STORAGE_ROOT:./uploads}
    public_base_url: ${env:LOCAL_STORAGE_PUBLIC_BASE_URL:/api/v1/files}
    bucket: ${env:LOCAL_STORAGE_BUCKET:local}

# AI 能力配置:按能力三分(llm / image / video),各自独立指定 provider、模型与默认参数。
# - API key 一律经环境变量引用,yaml 不落明文(见 .env.example 的 AI_* 占位)。
# - 请求级参数可覆盖默认值:默认值收敛在这里,调用方(含前端经后端)只传业务参数。
# - enabled=false 或未配置时,该能力的调用链路返回 503(沿用 DEV-9 降级约定)。
# - 本期纯静态配置,修改后重启生效;管理端运行时读写暂不接入。
ai:
  llm:
    enabled: true
    provider: ${env:AI_LLM_PROVIDER:openai-compatible}
    base_url: ${env:AI_LLM_BASE_URL:}
    api_key: ${env:AI_LLM_API_KEY:}
    model: ${env:AI_LLM_MODEL:}
    default_params:
      temperature: 0.7
      max_tokens: 2048
      timeout_s: 60
      max_retries: 2
  image:
    enabled: false
    provider: ${env:AI_IMAGE_PROVIDER:openai-compatible}
    base_url: ${env:AI_IMAGE_BASE_URL:}
    api_key: ${env:AI_IMAGE_API_KEY:}
    model: ${env:AI_IMAGE_MODEL:}
    default_params:
      size: 1024x1024
      quality: standard
      n: 1
      response_format: url
  video:
    enabled: false
    provider: ${env:AI_VIDEO_PROVIDER:openai-compatible}
    base_url: ${env:AI_VIDEO_BASE_URL:}
    api_key: ${env:AI_VIDEO_API_KEY:}
    model: ${env:AI_VIDEO_MODEL:}
    default_params:
      duration_s: 10
      resolution: 720p

jwt:
  secret: ${env:JWT_SECRET}
  algorithm: ${env:JWT_ALGORITHM:HS256}
  access_expires_minutes: ${env:JWT_ACCESS_EXPIRES_MINUTES:60}
  refresh_expires_days: ${env:JWT_REFRESH_EXPIRES_DAYS:14}

wechat:
  open_appid: ${env:WECHAT_OPEN_APPID:}
  open_secret: ${env:WECHAT_OPEN_SECRET:}
  open_redirect_uri: ${env:WECHAT_OPEN_REDIRECT_URI:}
  mp_appid: ${env:WECHAT_MP_APPID:}
  mp_secret: ${env:WECHAT_MP_SECRET:}

# 网页端账号密码登录通道(生产可用;失败限流为进程内计数,重启清零)
auth:
  password_login_enabled: ${env:AUTH_PASSWORD_LOGIN_ENABLED:true}
  login_max_attempts: ${env:AUTH_LOGIN_MAX_ATTEMPTS:5}
  login_window_minutes: ${env:AUTH_LOGIN_WINDOW_MINUTES:15}

# 仅供开发/测试环境的开关,生产必须保持 false
dev:
  login_enabled: ${env:DEV_LOGIN_ENABLED:false}

# 预留,暂不接入
redis:
  enabled: ${env:REDIS_ENABLED:false}
  url: ${env:REDIS_URL:redis://localhost:6379/0}

# 经验值/等级数值(可选,缺省走代码内默认)
xp:
  base_xp: ${env:XP_BASE_XP:200}
  growth: ${env:XP_GROWTH:1.5}
  challenge_bonus: ${env:XP_CHALLENGE_BONUS:1.25}
  hidden_bonus: ${env:XP_HIDDEN_BONUS:1.15}
  chain_final_bonus: ${env:XP_CHAIN_FINAL_BONUS:1.5}
  timing_bonus: ${env:XP_TIMING_BONUS:1.2}
  timing_penalty: ${env:XP_TIMING_PENALTY:0.8}
  speed_window_minutes: ${env:XP_SPEED_WINDOW_MINUTES:60}
  speed_bonus: ${env:XP_SPEED_BONUS:1.1}
