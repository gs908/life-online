# docker-compose.yml
# 本地开发可选:起一套 MySQL + MinIO,方便没有远程数据库访问权限时联调。
# 生产/远程数据库场景无需使用本文件,后端直接用 server/.env 指向远程实例即可。
#
# 默认值与 server/.env.example / server/config.yaml 保持一致。

services:
  mysql:
    image: mysql:8.0
    container_name: life-online-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: salers
      MYSQL_USER: dev
      # 密码留空,与 server/.env.example 的 DATABASE_PASSWORD= 保持一致
    ports:
      - "4400:3306"
    volumes:
      - life-online-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: life-online-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - life-online-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  life-online-mysql-data:
  life-online-minio-data:
